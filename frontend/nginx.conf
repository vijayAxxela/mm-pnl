server {
    listen 5190;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — react-router handles client-side routes (e.g. /pnl,
    # /fills, /accounts), so any unknown path serves index.html and lets
    # the client-side router take over, instead of nginx 404ing on a
    # hard refresh at a non-root route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively — Vite fingerprints every
    # filename with a content hash, so a new deploy always ships new
    # filenames and this can never serve stale JS/CSS.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
