name: mm-pnl

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tt_pnl_dashboard}
    ports:
      # Localhost-only (127.0.0.1 prefix, not just "5434:5432") — lets a
      # local pgAdmin/psql on this machine connect for inspection without
      # exposing Postgres to the rest of the network. 5434 (not 5432 or
      # 5433) since 5432 is the native local Postgres install and 5433 is
      # already taken by the structurehub-prod stack's db on this same
      # machine (see structurehub/docker-compose.yml).
      - "127.0.0.1:5434:5432"
    volumes:
      # Named volume — survives `docker compose up -d --build` on every
      # redeploy. Only `docker compose down -v` (never run by the deploy
      # workflow) would remove it.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8020:8020"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tt_pnl_dashboard}
      TT_API_KEY: ${TT_API_KEY}
      TT_API_SECRET: ${TT_API_SECRET}
      TT_ENVIRONMENT: ${TT_ENVIRONMENT:-ext_prod_live}
      TRADING_DAY_START_TIME: ${TRADING_DAY_START_TIME:-06:00}
      PORT: 8020
      HOST: 0.0.0.0
      # Loss-alert emails (see backend/routes/alerts.py) — unset/empty
      # SMTP_HOST just logs a warning and skips sending, so these are safe
      # to leave blank in an env file that doesn't need email alerts.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5190:5190"
    depends_on:
      - backend

volumes:
  pgdata:
