name: Deploy

# Runs on a self-hosted runner installed on the same machine that serves the
# app (see https://github.com/<owner>/<repo>/settings/actions/runners) — the
# workflow just rebuilds and restarts the Docker Compose stack in place.
# There's no cloud host to SSH into and no image registry: the runner IS the
# deploy target.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # actions/checkout defaults to `git clean -ffdx` before checking out,
      # which removes ALL untracked files in the checkout dir — including
      # gitignored ones. A .env sitting at the repo root would get wiped on
      # every single run, so the real one lives outside the checkout
      # entirely (see DEPLOY_ENV_FILE below) and is never touched by this.
      - uses: actions/checkout@v4

      # Created once, manually, on the runner machine — NOT part of the
      # checkout, deliberately outside the workspace so `actions/checkout`'s
      # clean step can never remove it. Copy .env.example there and fill in
      # real values:
      #   cp .env.example C:\actions-runner-mmpnl\deploy.env
      - name: Build and deploy
        env:
          DEPLOY_ENV_FILE: C:\actions-runner-mmpnl\deploy.env
        run: docker compose --env-file "$env:DEPLOY_ENV_FILE" up -d --build

      # Alembic runs inside the backend container's entrypoint on every
      # start (see backend/entrypoint.sh) — migrations only ever ADD
      # schema changes forward, and the Postgres data itself lives in the
      # `pgdata` named volume, which this command never touches. A
      # redeploy updates the running code; it does not reset the database.
      - name: Prune old images
        run: docker image prune -f
